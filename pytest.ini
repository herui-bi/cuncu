[pytest]
testpaths = testcases
pythonpath = .
addopts =
    -v
    -ra
    --strict-markers
    --browser chromium
    --tracing=retain-on-failure
    --video=retain-on-failure
    --screenshot=only-on-failure
    --full-page-screenshot
    --output=reports/artifacts
    --alluredir=reports/allure-results
    --clean-alluredir
    --junitxml=reports/junit.xml
    --reruns=2
    --reruns-delay=1

markers =
    smoke: 冒烟用例
    login: 登录相关用例
    inventory: 商品与购物车相关用例
    policy: 个单投保相关用例
    huiqubao: 惠衢保 2027 订单升级相关用例
    excel: Excel 数据驱动用例
    p0: 最高优先级用例

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-7s | %(message)s
log_cli_date_format = %H:%M:%S
